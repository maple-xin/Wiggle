<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WIGGLE PARTY</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14152B;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Arial Black', Arial, Helvetica, sans-serif;
  }
  canvas#c { position: fixed; inset: 0; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none; }
  body.ingame #hud { display: block; }
  #badge {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 14px;
    background: #F5D93F; color: #1B1B1F;
    border: 4px solid #1B1B1F; border-radius: 14px;
    box-shadow: 0 4px 0 #1B1B1F;
    font-weight: 900; font-size: 11px; letter-spacing: 2px;
    padding: 9px 13px;
  }
  #cntwrap {
    position: absolute; top: calc(env(safe-area-inset-top) + 62px); left: 14px;
    background: #fff; color: #1B1B1F;
    border: 4px solid #1B1B1F; border-radius: 14px;
    box-shadow: 0 4px 0 #1B1B1F;
    font-weight: 900; font-size: 20px; letter-spacing: 1px;
    padding: 8px 14px;
  }
  #cntwrap small { display: block; font-size: 8px; letter-spacing: 2px; color: #6F73A8; }
  #right { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 14px; text-align: right; }
  #best {
    display: inline-block; background: #fff; color: #1B1B1F;
    border: 4px solid #1B1B1F; border-radius: 999px;
    box-shadow: 0 4px 0 #1B1B1F;
    font-weight: 900; font-size: 11px; letter-spacing: 1px;
    padding: 8px 14px;
  }
  #mute {
    margin-top: 10px; pointer-events: auto; cursor: pointer;
    background: #fff; color: #1B1B1F;
    border: 3px solid #1B1B1F; border-radius: 999px;
    box-shadow: 0 3px 0 #1B1B1F;
    font-weight: 900; font-family: inherit;
    font-size: 9px; letter-spacing: 1px; padding: 7px 10px;
  }
  .ov {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .ov.show { display: flex; }
  #title { background: rgba(20,21,43,0.82); z-index: 40; }
  #title h1 {
    margin: 0; color: #F5D93F;
    font-size: 15vmin; line-height: .86; font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 5px 0 #1B1B1F;
  }
  #title h1 span { color: #6FCF7F; }
  #title .tag {
    margin: 18px 0 0; color: #fff; font-weight: 700;
    font-size: 13px; letter-spacing: 1px; line-height: 1.6;
  }
  #title .tag b { color: #F5D93F; }
  #title .best-line { color: #9AA0C8; font-weight: 900; font-size: 12px; margin-top: 10px; letter-spacing: 1px; }
  .btn {
    pointer-events: auto; cursor: pointer;
    background: #F5D93F; color: #1B1B1F;
    border: 4px solid #1B1B1F; border-radius: 18px;
    box-shadow: 0 6px 0 #1B1B1F;
    font-weight: 900; font-family: inherit;
    font-size: 20px; letter-spacing: 1px;
    padding: 16px 42px; margin-top: 20px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1B1B1F; }
  .btn.ghost { background: #fff; font-size: 13px; padding: 12px 26px; }
  .btn.small { font-size: 11px; padding: 10px 20px; margin-top: 12px; }
  #doneOv { background: rgba(20,21,43,0.88); z-index: 40; }
  #doneOv h2 {
    margin: 0; color: #6FCF7F; font-weight: 900;
    font-size: 12vmin; line-height: .9;
    text-shadow: 0 5px 0 #1B1B1F;
  }
  #doneOv .sub { color: #fff; font-weight: 900; font-size: 14px; margin-top: 14px; letter-spacing: 1px; }
  #doneOv .sub b { color: #F5D93F; }
  #floaters { position: fixed; inset: 0; z-index: 9; pointer-events: none; display: none; }
  body.ingame #floaters { display: block; }
  .floater {
    position: absolute; transform: translate(-50%, -50%);
    font-weight: 900; font-size: 20px; letter-spacing: 1px;
    white-space: nowrap; text-shadow: 0 4px 0 #1B1B1F;
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div id="badge">WIGGLE PARTY</div>
  <div id="cntwrap"><small>WIGGLERS</small><span id="cnt">0000</span></div>
  <div id="right">
    <span id="best">BEST 0000</span><br>
    <button id="mute">SND ON</button>
  </div>
</div>

<div id="floaters"></div>

<div id="title" class="ov show">
  <h1>WIGGLE<br><span>PARTY</span></h1>
  <p class="tag">Tap the disco floor to summon bald wigglers.<br>Drag to paint a crowd. <b>Reach 1000.</b></p>
  <p class="best-line" id="titleBest">BEST 0000</p>
  <button class="btn" id="startBtn">START THE PARTY</button>
</div>

<div id="doneOv" class="ov">
  <h2>PARTY LEGEND!</h2>
  <p class="sub" id="doneStats">YOU THREW A 1000-WIGGLE PARTY</p>
  <button class="btn" id="contBtn2">KEEP PARTYING</button>
  <button class="btn ghost" id="againBtn">PLAY AGAIN</button>
  <button class="btn ghost small" id="shareBtn">BRAG TO FRIENDS</button>
</div>

<div id="cdnmsg" class="ov">
  <h2 style="color:#E2574C;font-weight:900;font-size:8vmin;margin:0">3D ENGINE OFFLINE</h2>
  <p class="tag" style="color:#fff">WIGGLE PARTY needs three.js.<br>Check the connection and reload.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
/* ============ WIGGLE PARTY 3D ============
   Real WebGL/three.js scene. Low-poly bald wigglers.
   Tap the 3D disco floor to summon dancers, drag to
   paint a crowd, fast taps trigger FRENZY. The floor,
   disco ball, dance move and beat escalate every level.
   Goal: 1000 wigglers. */

function boot() {
  var THREE = window.THREE;
  if (!THREE) { document.getElementById('cdnmsg').classList.add('show'); return; }

  var cvs = document.getElementById('c');
  var W = window.innerWidth, H = window.innerHeight, DPR = 1;

  var INK = 0x1B1B1F, BG = 0x14152B, SKIN = 0xF2C89B, GREEN = 0x6FCF7F,
      BLUE = 0x4A63D8, SHOE = 0x8A5A36, RED = 0xE2574C, YEL = 0xF5D93F,
      WHITE = 0xFFFFFF;

  var C_INK = new THREE.Color(INK), C_SKIN = new THREE.Color(SKIN),
      C_GREEN = new THREE.Color(GREEN), C_BLUE = new THREE.Color(BLUE),
      C_SHOE = new THREE.Color(SHOE), C_RED = new THREE.Color(RED),
      C_YEL = new THREE.Color(YEL), C_WHITE = new THREE.Color(WHITE);

  var BPM = 124;
  var MAXD = 2000;
  var MOVES = ['BOUNCE', 'WAVE', 'SWAY', 'SPIN'];
  var LEVELS = [
    { at: 0,    pal: 0, move: 0, msg: 'PARTY START!' },
    { at: 25,   pal: 1, move: 1, msg: 'THE WAVE!' },
    { at: 50,   pal: 2, move: 2, msg: 'EVERYBODY SWAY!' },
    { at: 100,  pal: 3, move: 3, msg: 'SPIN CYCLE!' },
    { at: 200,  pal: 4, move: 0, msg: 'FLOOR MELTDOWN!' },
    { at: 350,  pal: 5, move: 1, msg: 'STROBE MODE!' },
    { at: 500,  pal: 0, move: 2, msg: 'CROWN SEASON!' },
    { at: 750,  pal: 1, move: 3, msg: 'MAXIMUM WIGGLE!' },
    { at: 1000, pal: 2, move: 3, msg: 'PARTY LEGEND!' }
  ];
  var FLOOR_PAL = [];
  var rawPal = [
    [0x3B2E63, 0x4C3B7E], [0x7A2E5A, 0x96386F], [0x1E5A6E, 0x2A7690],
    [0x6E3B1E, 0x8E4E28], [0x2E6E3B, 0x3C8E4C], [0x5A1E3B, 0x7A2A50]
  ];
  for (var pi = 0; pi < rawPal.length; pi++) {
    FLOOR_PAL.push([new THREE.Color(rawPal[pi][0]), new THREE.Color(rawPal[pi][1])]);
  }

  var LADDER = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  var CALLS = ['WIGGLE!', 'HA!', 'BOOM!', 'YEAH!', 'OO LA LA!'];

  /* ---------- three.js core ---------- */
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = null;

  var camDist = 14.5, camHeight = 4.3, camTargetY = 1.35, camLookZ = -1;
  var camPanX = 0, camPanZ = 0;
  var camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 140);
  camera.position.set(camPanX, camHeight, camDist + camPanZ);
  camera.lookAt(camPanX, camTargetY, camPanZ + camLookZ);

  var renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(W, H, false);

  var raycaster = new THREE.Raycaster();
  var floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var tmpVec = new THREE.Vector3();
  var dummy = new THREE.Object3D();
  var offsetMat = new THREE.Matrix4();
  var accentMat = new THREE.Matrix4();
  var colVec = new THREE.Color();

  scene.add(new THREE.HemisphereLight(0x9AA0C8, 0x1C1B34, 0.62));
  var keyLight = new THREE.DirectionalLight(0xFFFFFF, 0.82);
  keyLight.position.set(4, 9, 6);
  scene.add(keyLight);
  var rimLight = new THREE.PointLight(BLUE, 0.5, 28);
  rimLight.position.set(-4, 3, -5);
  scene.add(rimLight);

  function makeToonGradient() {
    var steps = new Uint8Array([70, 150, 235]);
    var tex = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  }
  var toonGradient = makeToonGradient();

  /* ---------- low-poly geometry merge ---------- */
  function mergeGeoms(parts) {
    var pos = [], nor = [], col = [];
    var m = new THREE.Matrix4(), e = new THREE.Euler();
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
      e.set(p.rot ? (p.rot[0] || 0) : 0, p.rot ? (p.rot[1] || 0) : 0, p.rot ? (p.rot[2] || 0) : 0);
      m.makeRotationFromEuler(e);
      m.setPosition(p.pos.x || 0, p.pos.y || 0, p.pos.z || 0);
      g.applyMatrix4(m);
      var pa = g.attributes.position.array;
      var na = g.attributes.normal.array;
      for (var j = 0; j < pa.length; j++) { pos.push(pa[j]); nor.push(na[j]); }
      var c = p.color;
      for (var k = 0; k < pa.length / 3; k++) { col.push(c.r, c.g, c.b); }
      g.dispose();
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return geo;
  }

  function makeDancerGeometry() {
    return mergeGeoms([
      { geo: new THREE.BoxGeometry(0.18, 0.62, 0.18), color: C_BLUE, pos: { x: -0.15, y: 0.33, z: 0 } },
      { geo: new THREE.BoxGeometry(0.18, 0.62, 0.18), color: C_BLUE, pos: { x: 0.15, y: 0.33, z: 0 } },
      { geo: new THREE.BoxGeometry(0.25, 0.12, 0.32), color: C_SHOE, pos: { x: -0.15, y: 0.06, z: 0.05 } },
      { geo: new THREE.BoxGeometry(0.25, 0.12, 0.32), color: C_SHOE, pos: { x: 0.15, y: 0.06, z: 0.05 } },
      { geo: new THREE.BoxGeometry(0.14, 0.52, 0.14), color: C_GREEN, pos: { x: -0.36, y: 1.06, z: 0 } },
      { geo: new THREE.BoxGeometry(0.14, 0.52, 0.14), color: C_GREEN, pos: { x: 0.36, y: 1.06, z: 0 } },
      { geo: new THREE.BoxGeometry(0.58, 0.62, 0.36), color: C_GREEN, pos: { x: 0, y: 1.04, z: 0 } },
      { geo: new THREE.SphereGeometry(0.34, 18, 14), color: C_SKIN, pos: { x: 0, y: 1.56, z: 0 } },
      { geo: new THREE.SphereGeometry(0.052, 8, 6), color: C_INK, pos: { x: -0.12, y: 1.62, z: 0.29 } },
      { geo: new THREE.SphereGeometry(0.052, 8, 6), color: C_INK, pos: { x: 0.12, y: 1.62, z: 0.29 } },
      { geo: new THREE.BoxGeometry(0.13, 0.05, 0.04), color: C_RED, pos: { x: 0, y: 1.43, z: 0.29 } }
    ]);
  }

  function makeHatGeometry() {
    return mergeGeoms([
      { geo: new THREE.ConeGeometry(0.2, 0.4, 12), color: C_YEL, pos: { x: 0, y: 0, z: 0 } },
      { geo: new THREE.SphereGeometry(0.06, 8, 6), color: C_RED, pos: { x: 0, y: 0.22, z: 0 } }
    ]);
  }
  function makeCrownGeometry() {
    return mergeGeoms([
      { geo: new THREE.BoxGeometry(0.32, 0.08, 0.32), color: C_YEL, pos: { x: 0, y: 0, z: 0 } },
      { geo: new THREE.ConeGeometry(0.05, 0.14, 6), color: C_YEL, pos: { x: -0.11, y: 0.09, z: 0 } },
      { geo: new THREE.ConeGeometry(0.05, 0.14, 6), color: C_YEL, pos: { x: 0, y: 0.1, z: 0 } },
      { geo: new THREE.ConeGeometry(0.05, 0.14, 6), color: C_YEL, pos: { x: 0.11, y: 0.09, z: 0 } }
    ]);
  }
  function makeShadesGeometry() {
    return mergeGeoms([
      { geo: new THREE.BoxGeometry(0.16, 0.14, 0.06), color: C_INK, pos: { x: -0.13, y: 0, z: 0 } },
      { geo: new THREE.BoxGeometry(0.16, 0.14, 0.06), color: C_INK, pos: { x: 0.13, y: 0, z: 0 } },
      { geo: new THREE.BoxGeometry(0.2, 0.035, 0.03), color: C_INK, pos: { x: 0, y: -0.01, z: -0.02 } }
    ]);
  }

  var dancerGeo = makeDancerGeometry();
  var hatGeo = makeHatGeometry();
  var crownGeo = makeCrownGeometry();
  var shadesGeo = makeShadesGeometry();

  var bodyToonMat = new THREE.MeshToonMaterial({ color: 0xFFFFFF, gradientMap: toonGradient, vertexColors: true });
  var floorToonMat = new THREE.MeshToonMaterial({ color: 0xFFFFFF, gradientMap: toonGradient });

  var bodyMesh = new THREE.InstancedMesh(dancerGeo, bodyToonMat, MAXD);
  bodyMesh.frustumCulled = false;
  bodyMesh.count = 0;
  scene.add(bodyMesh);

  var hatMesh = new THREE.InstancedMesh(hatGeo, bodyToonMat, MAXD);
  var crownMesh = new THREE.InstancedMesh(crownGeo, bodyToonMat, MAXD);
  var shadesMesh = new THREE.InstancedMesh(shadesGeo, bodyToonMat, MAXD);
  [hatMesh, crownMesh, shadesMesh].forEach(function (m) {
    m.frustumCulled = false; m.count = 0; scene.add(m);
  });

  var sparkGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
  var confGeo = new THREE.BoxGeometry(0.13, 0.17, 0.05);
  var partMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  var sparkMesh = new THREE.InstancedMesh(sparkGeo, partMat, 300);
  var confMesh = new THREE.InstancedMesh(confGeo, partMat, 320);
  [sparkMesh, confMesh].forEach(function (m) {
    m.frustumCulled = false; m.count = 0; scene.add(m);
    for (var i = 0; i < m.count; i++) { m.setColorAt(i, C_WHITE); }
  });

  /* ---------- 3D disco floor + ball ---------- */
  var FLOOR_W = 30, FLOOR_D = 26, FLOOR_COLS = 15, FLOOR_ROWS = 13;
  var tileGeo = new THREE.BoxGeometry(FLOOR_W / FLOOR_COLS, 0.14, FLOOR_D / FLOOR_ROWS);
  var floorMesh = new THREE.InstancedMesh(tileGeo, floorToonMat, FLOOR_COLS * FLOOR_ROWS);
  floorMesh.frustumCulled = false;
  var floorIdx = 0;
  for (var fr = 0; fr < FLOOR_ROWS; fr++) {
    for (var fc = 0; fc < FLOOR_COLS; fc++) {
      var fx = -FLOOR_W / 2 + (FLOOR_W / FLOOR_COLS) * (fc + 0.5);
      var fz = -FLOOR_D / 2 + (FLOOR_D / FLOOR_ROWS) * (fr + 0.5);
      dummy.position.set(fx, -0.07, fz);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      floorMesh.setMatrixAt(floorIdx++, dummy.matrix);
    }
  }
  floorMesh.instanceMatrix.needsUpdate = true;
  scene.add(floorMesh);

  var ballPivot = new THREE.Object3D();
  var rodGeo = new THREE.CylinderGeometry(0.035, 0.035, 1.5, 6);
  var rod = new THREE.Mesh(rodGeo, new THREE.MeshBasicMaterial({ color: INK }));
  rod.position.y = 0.75;
  ballPivot.add(rod);
  var ballGeo = new THREE.IcosahedronGeometry(0.85, 1);
  var ballMat = new THREE.MeshPhongMaterial({ color: 0xC9CFEE, shininess: 90, specular: 0xFFFFFF, flatShading: true });
  var ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.y = 0;
  ballPivot.add(ball);
  var ballLight = new THREE.PointLight(YEL, 0.9, 34);
  ballLight.position.set(0, 0, 0);
  ballPivot.add(ballLight);
  scene.add(ballPivot);

  var floorParity = -1;
  function paintFloor() {
    var pal = FLOOR_PAL[LEVELS[level].pal];
    var parity = Math.floor(tGlobal * BPM / 60) % 2;
    if (parity === floorParity) return;
    floorParity = parity;
    for (var i = 0; i < FLOOR_COLS * FLOOR_ROWS; i++) {
      var r = Math.floor(i / FLOOR_COLS), c = i % FLOOR_COLS;
      colVec.copy(((r + c + parity) % 2 === 0) ? pal[0] : pal[1]);
      floorMesh.setColorAt(i, colVec);
    }
    floorMesh.instanceColor.needsUpdate = true;
  }

  /* ---------- audio (synth beat, no files) ---------- */
  var AC = null, master = null, muted = false;
  function audio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain(); master.gain.value = 0.3;
        master.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function blip(freq, when, dur, type, gain) {
    if (!AC || muted) return;
    var t = when || AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.4, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + (dur || 0.12) + 0.05);
  }
  function kick(t) {
    if (!AC || muted) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.8, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.17);
  }
  function hat(t) { blip(5200, t, 0.03, 'square', 0.07); }
  function bass(f, t, dur) { blip(f, t, dur, 'sawtooth', 0.14); }
  var step16 = 0, next16 = 0;
  function sched() {
    if (!AC || muted) return;
    var spb = 60 / BPM / 4;
    if (next16 < AC.currentTime) next16 = AC.currentTime + 0.02;
    var ahead = AC.currentTime + 0.16;
    var bars = [0, 0, 5, 3];
    while (next16 < ahead) {
      var s = step16 % 16;
      if (s % 4 === 0) kick(next16);
      if (s % 2 === 1) hat(next16);
      if (s % 2 === 0) bass(110 * Math.pow(2, bars[Math.floor(step16 / 16) % 4] / 12), next16, 0.11);
      next16 += spb; step16++;
    }
  }

  /* ---------- state ---------- */
  var state = 'title'; /* title | play | done */
  var dancers = [], sparkles = [], confetti = [], floaters = [];
  var count = 0, best = 0, level = 0, frenzy = 0, lastTapT = -9, tGlobal = 0;
  var flash = 0, dragging = false, lastPtNdc = null, callT = 2;
  var pointers = {}, pinch = null;

  var $ = function (id) { return document.getElementById(id); };
  var cntEl = $('cnt'), bestEl = $('best'), titleBestEl = $('titleBest');
  var floatLayer = $('floaters'), flashEl = $('flash');

  function loadBest() {
    try { best = parseInt(localStorage.getItem('wiggle_best') || '0', 10) || 0; } catch (e) { best = 0; }
    bestEl.textContent = 'BEST ' + pad(best);
    titleBestEl.textContent = 'BEST ' + pad(best);
  }
  function pad(n) { return ('0000' + n).slice(-4); }
  function saveBest() {
    if (count > best) {
      best = count;
      try { localStorage.setItem('wiggle_best', String(best)); } catch (e) {}
      bestEl.textContent = 'BEST ' + pad(best);
      titleBestEl.textContent = 'BEST ' + pad(best);
    }
  }
  function updateHud() { cntEl.textContent = pad(count); }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  /* ---------- spawning ---------- */
  function pickAcc() {
    var r = Math.random();
    if (level >= 7 && r < 0.10) return 3;
    if (level >= 4 && r < 0.26) return 2;
    if (r < 0.42) return 1;
    return 0;
  }
  function scaleForZ(z) {
    return Math.max(0.4, Math.min(1.15, 0.42 + (z + 12) / 20));
  }
  function spawnDancer(x, z, demo) {
    if (!demo && dancers.length >= MAXD) return null;
    var xClamped = Math.max(-11, Math.min(11, x));
    var zClamped = Math.max(-12, Math.min(8, z));
    var d = {
      x: xClamped, z: zClamped, s: scaleForZ(zClamped),
      yaw: (Math.random() - 0.5) * 0.5, spinA: 0, spinT: 0, spinFrom: 0,
      acc: pickAcc(), jt: 0.99, jd: 0.34,
      phase: Math.random() * 6.283, demo: !!demo
    };
    dancers.push(d);
    return d;
  }
  function burstSparkles(x, y, z, n, col) {
    if (sparkles.length > 240) return;
    for (var i = 0; i < n; i++) {
      sparkles.push({
        x: x, y: y, z: z,
        vx: (Math.random() - 0.5) * 1.6, vy: Math.random() * 1.5 + 0.5, vz: (Math.random() - 0.5) * 1.6,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 12,
        t: 0, life: 0.45 + Math.random() * 0.3, col: col || C_YEL
      });
    }
  }
  function confettiBurst(x, y, z, n) {
    if (confetti.length > 260) return;
    var cols = [C_YEL, C_GREEN, C_BLUE, C_RED, C_WHITE];
    for (var i = 0; i < n; i++) {
      confetti.push({
        x: x, y: y, z: z,
        vx: (Math.random() - 0.5) * 5.2, vy: Math.random() * 4.4 + 1.8, vz: (Math.random() - 0.5) * 2.2,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 12,
        t: 0, life: 1.1 + Math.random() * 0.8,
        col: cols[(Math.random() * cols.length) | 0]
      });
    }
  }
  function floater(sx, sy, txt, col, life) {
    if (floaters.length > 24) {
      var old = floaters.shift();
      if (old && old.el && old.el.parentNode) old.el.parentNode.removeChild(old.el);
    }
    var el = document.createElement('div');
    el.className = 'floater';
    el.textContent = txt;
    el.style.color = col || '#FFFFFF';
    el.style.left = sx + 'px';
    el.style.top = sy + 'px';
    floatLayer.appendChild(el);
    floaters.push({ el: el, x: sx, y: sy, t: 0, life: life || 1.1 });
  }
  function worldToScreen(x, y, z) {
    tmpVec.set(x, y, z).project(camera);
    return { x: (tmpVec.x * 0.5 + 0.5) * W, y: (-tmpVec.y * 0.5 + 0.5) * H, z: tmpVec.z };
  }
  function soloHit(x, y) {
    for (var i = dancers.length - 1; i >= 0 && i >= dancers.length - 220; i--) {
      var d = dancers[i];
      if (d.demo) continue;
      var p = worldToScreen(d.x, 1.56 * d.s, d.z);
      if (Math.abs(x - p.x) < 40 * d.s && Math.abs(y - p.y) < 48 * d.s) return d;
    }
    return null;
  }
  function summonAt(x, z) {
    var d = spawnDancer(x, z);
    if (!d) return;
    count++;
    var f = 220 * Math.pow(2, LADDER[count % LADDER.length] / 12);
    audio();
    blip(f, 0, 0.11, 'triangle', 0.5);
    burstSparkles(d.x, 1.1 * d.s, d.z, 5, C_YEL);
    checkLevel();
    updateHud();
  }
  function tapAtWorld(x, z, sx, sy) {
    if (state !== 'play') return;
    var now = tGlobal;
    if (now - lastTapT < 0.33) frenzy = Math.min(1.5, frenzy + 0.34);
    else frenzy = Math.max(0, frenzy - 0.6);
    lastTapT = now;

    var s = soloHit(sx, sy);
    if (s) {
      s.spinT = 0.5; s.spinFrom = s.spinA; s.jt = 0; s.jd = 0.3;
      var sp = worldToScreen(s.x, 2.2 * s.s, s.z);
      burstSparkles(s.x, 1.7 * s.s, s.z, 9, C_WHITE);
      floater(sp.x, sp.y, 'NICE MOVE!', '#F5D93F', 0.8);
      blip(1180, 0, 0.08, 'square', 0.28);
    }

    if (frenzy >= 1) {
      frenzy = 0.3;
      flash = Math.max(flash, 0.4);
      var fp = worldToScreen(x, 2.4 * scaleForZ(z), z);
      floater(fp.x, fp.y, 'FRENZY!', '#F5D93F', 0.8);
      blip(880, 0, 0.14, 'sawtooth', 0.3);
      for (var i = 0; i < 4; i++) summonAt(x + (Math.random() - 0.5) * 1.6, z + (Math.random() - 0.5) * 0.9);
      confettiBurst(x, 1.8, z, 18);
    }
    summonAt(x, z);
  }

  function pointerWorld(e) {
    var r = cvs.getBoundingClientRect();
    var px = (e.clientX - r.left) * (W / r.width);
    var py = (e.clientY - r.top) * (H / r.height);
    raycaster.setFromCamera(new THREE.Vector2(px / W * 2 - 1, -(py / H) * 2 + 1), camera);
    var hit = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(floorPlane, hit)) return null;
    return { x: hit.x, y: hit.y, z: hit.z };
  }
  function pointerCount() {
    var n = 0;
    for (var k in pointers) if (pointers.hasOwnProperty(k)) n++;
    return n;
  }
  function pinchDistance() {
    var ids = [];
    for (var k in pointers) if (pointers.hasOwnProperty(k)) ids.push(k);
    if (ids.length < 2) return null;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), a: ids[0], b: ids[1] };
  }
  function zoomBy(factor) {
    camDist = Math.max(9, Math.min(24, camDist * factor));
  }
  function clientPt(e) {
    var r = cvs.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }

  cvs.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    e.preventDefault();
    audio();
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pointerCount() === 2) {
      var pd = pinchDistance();
      if (pd) pinch = { d: pd.d, a: pd.a, b: pd.b };
      dragging = false; lastPtNdc = null;
      return;
    }
    if (pointerCount() !== 1) return;
    var hit = pointerWorld(e);
    if (!hit) return;
    var p = clientPt(e);
    tapAtWorld(hit.x, hit.z, p.x, p.y);
    dragging = true;
    lastPtNdc = p;
  });
  cvs.addEventListener('pointermove', function (e) {
    if (state !== 'play') return;
    if (!pointers[e.pointerId]) return;
    e.preventDefault();
    pointers[e.pointerId].x = e.clientX;
    pointers[e.pointerId].y = e.clientY;

    if (pinch) {
      var pd = pinchDistance();
      if (pd && pd.d > 4) {
        var factor = pinch.d / pd.d;
        if (factor > 0.75 && factor < 1.33) zoomBy(factor);
        pinch.d = pd.d;
      }
      return;
    }
    if (!dragging) return;
    var p = clientPt(e);
    if (!lastPtNdc) lastPtNdc = p;
    var dx = p.x - lastPtNdc.x, dy = p.y - lastPtNdc.y;
    if (dx * dx + dy * dy > 34 * 34) {
      var hit = pointerWorld(e);
      if (hit) tapAtWorld(hit.x, hit.z, p.x, p.y);
      lastPtNdc = p;
    }
  });
  function endPtr(e) {
    if (pointers[e.pointerId]) delete pointers[e.pointerId];
    if (pinch && (!pointers[pinch.a] || !pointers[pinch.b])) pinch = null;
    dragging = false; lastPtNdc = null;
  }
  cvs.addEventListener('pointerup', endPtr);
  cvs.addEventListener('pointercancel', endPtr);
  cvs.addEventListener('pointerleave', endPtr);
  cvs.addEventListener('wheel', function (e) {
    if (state !== 'play') return;
    e.preventDefault();
    zoomBy(e.deltaY > 0 ? 1.1 : 0.9);
  }, { passive: false });

  /* ---------- levels / flow ---------- */
  function checkLevel() {
    var nl = 0;
    for (var i = 0; i < LEVELS.length; i++) if (count >= LEVELS[i].at) nl = i;
    if (nl > level) {
      level = nl;
      celebrate(nl);
    } else if (count > 0 && count % 100 === 0) {
      floater(W / 2, H * 0.32, count + ' WIGGLERS!', '#F5D93F', 1.2);
      confettiBurst(0, 2.2, 2.5, 30);
      blip(990, 0, 0.12, 'triangle', 0.3);
    }
  }
  function celebrate(nl) {
    var L = LEVELS[nl];
    flash = Math.max(flash, 0.5);
    floater(W / 2, H * 0.3, L.msg, '#F5D93F', 1.8);
    floater(W / 2, H * 0.3 + 34, 'NEW MOVE: ' + MOVES[L.move], '#FFFFFF', 1.8);
    confettiBurst(0, 2.3, 2.5, 70);
    audio();
    var chord = [0, 4, 7, 12, 16];
    for (var i = 0; i < chord.length; i++) {
      blip(220 * Math.pow(2, chord[i] / 12), AC ? AC.currentTime + i * 0.07 : 0, 0.16, 'triangle', 0.34);
    }
    saveBest();
    if (nl === LEVELS.length - 1) winGame();
  }
  function winGame() {
    state = 'done';
    saveBest();
    $('doneStats').innerHTML = 'YOU THREW A <b>' + count + '</b>-WIGGLE PARTY<br>IN <b>' + Math.round(tGlobal) + '</b> SECONDS';
    $('doneOv').classList.add('show');
  }
  function resetGame() {
    dancers = [];
    count = 0; level = 0; frenzy = 0; lastTapT = -9;
    sparkles = []; confetti = [];
    while (floaters.length) {
      var fl = floaters.pop();
      if (fl.el && fl.el.parentNode) fl.el.parentNode.removeChild(fl.el);
    }
    dragging = false; lastPtNdc = null;
    pointers = {}; pinch = null;
    state = 'play';
    document.body.classList.add('ingame');
    updateHud();
    floater(W / 2, H * 0.34, 'PINCH OR SCROLL TO ZOOM', '#FFFFFF', 2.2);
  }
  function demoParty() {
    dancers = [];
    for (var i = 0; i < 4; i++) spawnDancer(-2.5 + i * 1.7, -0.6, true);
  }
  demoParty();

  $('startBtn').addEventListener('click', function () {
    audio();
    $('title').classList.remove('show');
    resetGame();
  });
  $('againBtn').addEventListener('click', function () {
    audio();
    $('doneOv').classList.remove('show');
    resetGame();
  });
  $('contBtn2').addEventListener('click', function () {
    audio();
    $('doneOv').classList.remove('show');
    state = 'play';
  });
  $('shareBtn').addEventListener('click', function () {
    var txt = 'I just threw a ' + count + '-wiggle party in WIGGLE PARTY!';
    try {
      if (navigator.share) { navigator.share({ title: 'WIGGLE PARTY', text: txt }); return; }
    } catch (e) {}
    floater(W / 2, H * 0.4, 'SCREENSHOT IT AND SHARE!', '#F5D93F', 1.6);
  });
  $('mute').addEventListener('click', function () {
    muted = !muted;
    this.textContent = muted ? 'SND OFF' : 'SND ON';
    if (!muted) { audio(); next16 = 0; }
  });
  loadBest();
  updateHud();
  paintFloor();

  /* ---------- update ---------- */
  function update(dt) {
    tGlobal += dt;
    var i, d;
    var move = LEVELS[level].move;
    var beatT = tGlobal * BPM / 60 * Math.PI;

    for (i = 0; i < dancers.length; i++) {
      d = dancers[i];
      if (d.jt < d.jd) d.jt += dt;
      if (d.spinT > 0) {
        d.spinT -= dt;
        var k = 1 - Math.max(0, d.spinT) / 0.5;
        d.spinA = d.spinFrom + k * Math.PI * 2;
      } else {
        d.spinFrom = d.spinA;
      }
      if (move === 3) d.yaw += dt * (2.2 + level * 0.06);
    }

    for (i = sparkles.length - 1; i >= 0; i--) {
      var sp = sparkles[i];
      sp.t += dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt;
      sp.vy += 5.2 * dt; sp.rot += sp.vr * dt;
      if (sp.t >= sp.life) sparkles.splice(i, 1);
    }
    for (i = confetti.length - 1; i >= 0; i--) {
      var cf = confetti[i];
      cf.t += dt;
      cf.x += cf.vx * dt; cf.y += cf.vy * dt; cf.z += cf.vz * dt;
      cf.vy += 6.4 * dt; cf.rot += cf.vr * dt;
      if (cf.t >= cf.life) confetti.splice(i, 1);
    }
    for (i = floaters.length - 1; i >= 0; i--) {
      var fl = floaters[i];
      fl.t += dt;
      var a = Math.max(0, 1 - fl.t / fl.life);
      fl.el.style.opacity = Math.min(1, a * 2.2);
      fl.el.style.transform = 'translate(-50%,-50%) translateY(' + (-32 * fl.t) + 'px)';
      if (fl.t >= fl.life) {
        if (fl.el && fl.el.parentNode) fl.el.parentNode.removeChild(fl.el);
        floaters.splice(i, 1);
      }
    }
    if (flash > 0) {
      flash = Math.max(0, flash - dt * 1.6);
      flashEl.style.opacity = flash;
    }
    if (state === 'play' && count > 0) {
      callT -= dt;
      if (callT <= 0) {
        callT = 2 + Math.random();
        var c = dancers[(Math.random() * dancers.length) | 0];
        if (c && !c.demo) {
          var cp = worldToScreen(c.x, 2.1 * c.s, c.z);
          floater(cp.x, cp.y, CALLS[(Math.random() * CALLS.length) | 0], '#FFFFFF', 0.9);
        }
      }
    }
    sched();
  }

  function updateInstances() {
    var move = LEVELS[level].move;
    var beatT = tGlobal * BPM / 60 * Math.PI;
    var i, d;
    var hi = 0, ci = 0, si = 0;
    bodyMesh.count = Math.min(dancers.length, MAXD);
    hatMesh.count = 0; crownMesh.count = 0; shadesMesh.count = 0;

    for (i = 0; i < dancers.length; i++) {
      d = dancers[i];
      var ph = beatT + d.phase;
      var bob = 0, roll = 0, pitch = 0, xoff = 0;
      var sx = d.s, sy = d.s, sz = d.s;

      if (move === 0) {           /* BOUNCE */
        var bsn = Math.sin(ph * 2);
        bob = Math.abs(bsn) * 0.24 * d.s;
        sy = d.s * (1 - 0.09 * bsn);
        sx = d.s * (1 + 0.09 * bsn);
      } else if (move === 1) {    /* WAVE */
        roll = Math.sin(ph) * 0.14;
        bob = Math.abs(Math.sin(ph)) * 0.1 * d.s;
      } else if (move === 2) {    /* SWAY */
        roll = Math.sin(ph) * 0.18;
        xoff = Math.sin(ph) * 0.16;
        bob = Math.abs(Math.sin(ph * 1.4)) * 0.07 * d.s;
      } else {                    /* SPIN handled by yaw */
        bob = Math.abs(Math.sin(ph)) * 0.14 * d.s;
        sy = d.s * (1 - 0.05 * Math.sin(ph));
        sx = d.s * (1 + 0.05 * Math.sin(ph));
      }
      if (d.jt < d.jd) bob += -Math.sin(Math.PI * d.jt / d.jd) * 0.45 * d.s;

      dummy.position.set(d.x + xoff, bob, d.z);
      dummy.rotation.set(pitch, d.yaw + d.spinA, roll);
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();
      bodyMesh.setMatrixAt(i, dummy.matrix);

      if (d.acc === 1) {
        offsetMat.makeTranslation(0, 1.82, 0);
        accentMat.multiplyMatrices(dummy.matrix, offsetMat);
        hatMesh.setMatrixAt(hi++, accentMat);
      } else if (d.acc === 2) {
        offsetMat.makeTranslation(0, 1.6, 0.3);
        accentMat.multiplyMatrices(dummy.matrix, offsetMat);
        shadesMesh.setMatrixAt(si++, accentMat);
      } else if (d.acc === 3) {
        offsetMat.makeTranslation(0, 1.88, 0);
        accentMat.multiplyMatrices(dummy.matrix, offsetMat);
        crownMesh.setMatrixAt(ci++, accentMat);
      }
    }

    bodyMesh.instanceMatrix.needsUpdate = true;
    if (hi) { hatMesh.count = hi; hatMesh.instanceMatrix.needsUpdate = true; }
    if (si) { shadesMesh.count = si; shadesMesh.instanceMatrix.needsUpdate = true; }
    if (ci) { crownMesh.count = ci; crownMesh.instanceMatrix.needsUpdate = true; }

    sparkMesh.count = sparkles.length;
    for (i = 0; i < sparkles.length; i++) {
      var sp = sparkles[i];
      var sc = 1 - sp.t / sp.life;
      dummy.position.set(sp.x, sp.y, sp.z);
      dummy.rotation.set(sp.rot, sp.rot * 0.7, 0);
      dummy.scale.setScalar(Math.max(0.15, sc));
      dummy.updateMatrix();
      sparkMesh.setMatrixAt(i, dummy.matrix);
      sparkMesh.setColorAt(i, sp.col);
    }
    if (sparkles.length) sparkMesh.instanceColor.needsUpdate = true;

    confMesh.count = confetti.length;
    for (i = 0; i < confetti.length; i++) {
      var cf = confetti[i];
      dummy.position.set(cf.x, cf.y, cf.z);
      dummy.rotation.set(cf.rot, cf.rot * 0.8, cf.rot * 1.4);
      dummy.scale.setScalar(Math.max(0.2, 1 - cf.t / cf.life * 0.4));
      dummy.updateMatrix();
      confMesh.setMatrixAt(i, dummy.matrix);
      confMesh.setColorAt(i, cf.col);
    }
    if (confetti.length) confMesh.instanceColor.needsUpdate = true;
  }

  function updateScene(dt) {
    camera.position.set(camPanX + Math.sin(tGlobal * 0.28) * 0.22, camHeight, camDist + camPanZ);
    camera.lookAt(camPanX, camTargetY, camPanZ + camLookZ);
    ballPivot.position.set(Math.sin(tGlobal * 0.5) * 2.6, 4.7, -1.4);
    ball.rotation.y += dt * 1.4;
    ball.rotation.x += dt * 0.5;
    ballLight.intensity = 0.75 + Math.abs(Math.sin(tGlobal * BPM / 60 * Math.PI)) * 0.55;
    paintFloor();
  }

  /* ---------- main loop ---------- */
  var lastT = -1;
  function loop(t) {
    requestAnimationFrame(loop);
    var dt = lastT < 0 ? 0 : Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    update(dt);
    updateInstances();
    updateScene(dt);
    renderer.render(scene, camera);
  }
  resize();
  requestAnimationFrame(loop);
}

if (window.THREE) {
  boot();
} else {
  var fallback = document.createElement('script');
  fallback.src = 'https://unpkg.com/three@0.149.0/build/three.min.js';
  fallback.onload = function () { boot(); };
  fallback.onerror = function () { document.getElementById('cdnmsg').classList.add('show'); };
  document.head.appendChild(fallback);
}
</script>
</body>
</html>
